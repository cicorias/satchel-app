# Toolchain pins and task entry points.
# Tasks are thin wrappers only — logic lives in scripts/<aspect>/ (ADR-0013).

[tools]
node = "24.17.0"
pnpm = "11.8.0"
xcodegen = { version = "2.46.0", os = ["macos"] }
gitleaks = "8.30.1"
shellcheck = "0.11.0"

[env]
_.path = ["./node_modules/.bin"]

# --- setup -------------------------------------------------------------------
[tasks.setup]
description = "Install deps, git hooks, and generate local config"
run = "scripts/setup/bootstrap.sh"

[tasks."setup:config"]
description = "Generate derived config (xcconfig, TS constants) from config/app.config.json"
run = "scripts/setup/gen-config.sh"

[tasks."setup:hooks"]
description = "Point git at the committed .githooks/"
run = "scripts/setup/install-hooks.sh"

# --- build -------------------------------------------------------------------
[tasks.build]
description = "Build all web packages and extension targets"
run = "scripts/build/web.sh"

[tasks."build:web-for-apple"]
description = "Build capture/render IIFEs + Safari extension and stage them for Xcode"
run = "scripts/build/web-for-apple.sh"

[tasks."build:extension"]
description = "Build the browser extension (chrome|edge|safari; default all)"
run = "scripts/build/extension.sh"

[tasks."build:ios"]
description = "Generate the Xcode project and build the iOS app for the simulator"
run = "scripts/build/ios.sh"

[tasks.clean]
description = "Remove build outputs (DEPS=1 also removes node_modules)"
run = "scripts/build/clean.sh"

[tasks."apple:project"]
description = "Generate apple/Satchel.xcodeproj with XcodeGen"
run = "scripts/build/xcodegen.sh"

# --- run ---------------------------------------------------------------------
[tasks."run:ios"]
description = "Build, install, and launch Satchel on a simulator (SIM=\"iPhone 18 Pro Max\", LOGS=1)"
run = "scripts/run/ios-sim.sh"

[tasks."test:ios-ui"]
description = "Run the UI tests that drive Settings and Safari on a simulator (ONLY=Class/test to pick one)"
run = "scripts/run/ios-ui-tests.sh"

[tasks."sim:stop"]
description = "Stop the app, shut down the simulator, quit DeviceHub/Simulator (ALL=1 for every simulator)"
run = "scripts/run/sim-stop.sh"

[tasks."sim:reset"]
description = "Uninstall Satchel and erase the simulator to factory state (PRUNE=1 deletes stale simulators)"
run = "scripts/run/sim-reset.sh"

# --- verify ------------------------------------------------------------------
[tasks.verify]
description = "Everything CI runs: secrets, shell lint, lint, typecheck, tests"
run = "scripts/verify/all.sh"

[tasks."verify:web"]
description = "Lint, typecheck, and test the TypeScript workspace"
run = "scripts/verify/web.sh"

[tasks."verify:apple"]
description = "Lint Swift and run SatchelKit tests"
run = "scripts/verify/apple.sh"

[tasks."verify:shell"]
description = "ShellCheck + bash 3.2 compatibility checks for all shell scripts"
run = "scripts/verify/shell.sh"

[tasks."test:golden"]
description = "Golden capture tests over fixtures/pages/ (-u rewrites expected.md)"
run = "scripts/verify/golden.sh"

[tasks."report:capture-timing"]
description = "Informational capture timing over fixtures/pages/ (never fails)"
run = "scripts/verify/capture-timing.sh"

[tasks."verify:secrets"]
description = "Scan the repo history and working tree for secrets"
run = "scripts/verify/secrets.sh"

[tasks.format]
description = "Format TypeScript (Biome) and Swift (swift-format)"
run = "scripts/verify/format.sh"

# --- art ---------------------------------------------------------------------
[tasks.art]
description = "Render all icons and store artwork from art/*.svg"
run = "scripts/art/render.sh"

[tasks."art:icon-preview"]
description = "Render the Liquid Glass app icon (default, dark, tinted) with Icon Composer's ictool"
run = "scripts/art/icon-preview.sh"

[tasks."art:screenshots"]
description = "Capture App Store screenshots on a fresh simulator and composite them into the frames"
run = "scripts/art/screenshots.sh"

# --- deploy ------------------------------------------------------------------
[tasks."deploy:ios-archive"]
description = "Archive and export a signed iOS build (App Store Connect)"
run = "scripts/deploy/ios-archive.sh"

[tasks."deploy:ios-upload"]
description = "Upload the exported IPA to App Store Connect / TestFlight"
run = "scripts/deploy/ios-upload.sh"

[tasks."deploy:cloudkit-schema"]
description = "Validate, import, or export the CloudKit schema (validate|import|export|diff; ENV=production)"
run = "scripts/deploy/cloudkit-schema.sh"

[tasks."deploy:extension-zips"]
description = "Produce Chrome and Edge store zips"
run = "scripts/deploy/extension-zips.sh"
