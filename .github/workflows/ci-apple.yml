name: ci-apple

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    # The Xcode 27 image (public preview) has the same Xcode as local and release builds. `macos-26` stops at
    # Xcode 26.6, whose Swift compiler differs (it rejected code 27.1 accepts). Back to `macos-26` with
    # XCODE_VERSION unset if the preview image is unavailable.
    runs-on: xcode-27
    env:
      XCODE_VERSION: "27.1"
    steps:
      - uses: actions/checkout@v5
      - run: scripts/ci/select-xcode.sh
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - run: mise run verify:shell # includes the /bin/bash 3.2 parse check
      - run: mise run verify:apple
      # Ad-hoc signed simulator build: no certificates or signing secrets in CI (ADR-0016).
      - run: mise run build:ios
